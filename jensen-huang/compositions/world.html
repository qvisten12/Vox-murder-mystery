    // ---------- helpers ----------
    function cam(cx, cy, s, t, d, ease) {
      tl.to("#map", { x: 960 - cx * s, y: 540 - cy * s, scale: s, duration: d, ease: ease || "power3.inOut" }, t);
    }
    function card(sel, t, rot) {
      tl.fromTo(sel, { opacity: 0, y: 40, scale: 0.97, rotation: rot || 0, filter: "blur(8px)" },
        { opacity: 1, y: 0, scale: 1, rotation: rot || 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, t);
    }
    function blurIn(sel, t) {
      tl.fromTo(sel, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, t);
    }
    function stamp(sel, t, rot) {
      tl.fromTo(sel, { opacity: 0, scale: 1.35, rotation: rot - 3 },
        { opacity: 1, scale: 1, rotation: rot, duration: 0.32, ease: "power3.out" }, t);
    }
    function draw(sel, t, d, ease) {
      tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: ease || "power2.inOut" }, t);
    }
    function roll(sel, from, to, t, d, fmt) {
      const o = { v: from };
      tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out",
        onUpdate: () => { document.querySelector(sel).textContent = fmt(o.v); } }, t);
    }
    const E = [2880, 1420];
    function tighten(sel, x1, y1, t, d) {
      const mx = (x1 + E[0]) / 2, my = (y1 + E[1]) / 2;
      tl.to(sel, { attr: { d: `M${x1} ${y1} Q${mx} ${my} ${E[0]} ${E[1]}` }, duration: d, ease: "power3.inOut" }, t);
    }

    // ---------- camera ----------
    tl.set("#map", { transformOrigin: "0px 0px" }, 0);
    tl.fromTo("#map", { x: 960 - 2880 * 1.55, y: 540 - 1760 * 1.55, scale: 1.55 },
